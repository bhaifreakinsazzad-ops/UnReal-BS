name: CI

# Gates every push and PR. Before this existed, nothing stopped a broken build,
# a type error, or failing money-math tests from reaching production — the only
# check was whether someone remembered to run the commands locally.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 30000

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint app components lib auth.ts proxy.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (pricing and billing math)
        run: npm test

      - name: Production dependency audit
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Running npm audit (attempt ${attempt}/3)..."
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed; retrying in $((attempt * 10)) seconds..."
              sleep $((attempt * 10))
            fi
          done
          echo "npm audit failed after 3 attempts"
          exit 1

      - name: Production build
        # Placeholder values only — the build must not require real secrets.
        # Anything that genuinely needs credentials has to degrade gracefully,
        # which is also what keeps local development working without them.
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-placeholder
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser launch gates
        run: npm run test:e2e
